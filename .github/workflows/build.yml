name: Build CI
on:
  workflow_dispatch:
    inputs:
      link:
        description: "Pega aqui tu link"
        required: true
      sukisu:
        description: "true"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Boot
        run: |
          wget -O boot.img "${{ github.event.inputs.link }}"
          wget https://github.com/bmax121/KernelPatch/releases/download/0.12.4/kptools-linux -O kptools
          chmod +x kptools
          ./kptools -g kpimg.elf
          ./kptools -i boot.img -p kpimg.elf --out boot-patched.img

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: boot-patched
          path: boot-patched.img
